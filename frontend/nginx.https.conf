limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;
server {
 listen 80 default_server;
 server_name codenova-solutions.fr;
 server_tokens off;
 return 308 https://codenova-solutions.fr$request_uri;
}
server {
 listen 443 ssl default_server;
 server_name codenova-solutions.fr;
 ssl_certificate /etc/nginx/tls/fullchain.pem;
 ssl_certificate_key /etc/nginx/tls/private.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_cache shared:TLS:10m;
 ssl_session_timeout 1d;
 ssl_session_tickets off;
 # Canonical host, including requests arriving through the former public IP.
 if ($host != codenova-solutions.fr) { return 308 https://codenova-solutions.fr$request_uri; }
 include /etc/nginx/codenova-site.conf;
}
