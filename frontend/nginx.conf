limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;
server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 client_max_body_size 32k;
 location = /api/login {
  limit_req zone=login burst=5 nodelay;
  proxy_pass http://backend:8080;
  proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
 }
 location = /api/contact {
  limit_req zone=contact burst=3 nodelay;
  proxy_pass http://backend:8080;
  proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
 }
 location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
 location = /admin { add_header X-Robots-Tag "noindex, nofollow" always; try_files /index.csr.html /index.html; }
 location / { try_files $uri $uri/ /index.html; }
}
