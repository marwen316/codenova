 server_tokens off;
 resolver 127.0.0.11 valid=5s ipv6=off;
 resolver_timeout 2s;
 set $backend_upstream http://backend:8080;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 client_max_body_size 32k;
 limit_req_status 429;
 location = /api/login {
  limit_req zone=login burst=5 nodelay;
  proxy_pass $backend_upstream;
  proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
 }
 location = /api/contact {
  limit_req zone=contact burst=3 nodelay;
  proxy_pass $backend_upstream;
  proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
 }
 location = /api/admin/media {
  client_max_body_size 5m;
  proxy_pass $backend_upstream;
  proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
 }
 location = /api/admin/content {
  client_max_body_size 1m;
  proxy_pass $backend_upstream;
  proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
 }
 location /api/ { proxy_pass $backend_upstream; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
 location = /admin { add_header X-Robots-Tag "noindex, nofollow" always; try_files /index.csr.html /index.html; }
 location / { try_files $uri $uri/ /index.html; }
