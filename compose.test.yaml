# Isolated local acceptance environment using the compiled production artifacts.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codenova
      POSTGRES_USER: codenova
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/setup.sh first}
    volumes:
      - test_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U codenova -d codenova]
      interval: 2s
      timeout: 5s
      retries: 30
  media-init:
    image: nginx:stable-alpine
    user: "0:0"
    entrypoint: [sh, -c, "chown 10001:10001 /media"]
    volumes:
      - test_media:/media
  backend:
    image: eclipse-temurin:21-jdk
    user: "10001:10001"
    working_dir: /app
    command: [java, -jar, /app/app.jar]
    volumes:
      - ./backend/target/codenova-1.0.0.jar:/app/app.jar:ro
      - test_media:/app/media
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/codenova
      DATABASE_USER: codenova
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Run scripts/setup.sh first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run scripts/setup.sh first}
      COOKIE_SECURE: "false"
      MEDIA_DIR: /app/media
    depends_on:
      db:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${TEST_PORT:-8088}:80"
    volumes:
      - ./frontend/dist/web/browser:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
volumes:
  test_data:
  test_media:
