spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/codenova}
spring.datasource.username=${DATABASE_USER:codenova}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
server.forward-headers-strategy=framework
app.media-dir=${MEDIA_DIR:.local/media}
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB

# Email alerts are opt-in. SMTP credentials remain server configuration.
app.contact-alerts.enabled=${CONTACT_ALERTS_ENABLED:false}
app.contact-alerts.from=${CONTACT_ALERTS_FROM:}
app.contact-alerts.to=${CONTACT_ALERTS_TO:}
app.contact-alerts.admin-url=${CONTACT_ALERTS_ADMIN_URL:https://codenova-solutions.fr/admin}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
